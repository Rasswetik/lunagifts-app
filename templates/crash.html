<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luna Gifts &mdash; Crash</title>
    <link rel="icon" href="/static/img/logo.png" type="image/png">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=20260403m">
    <link rel="stylesheet" href="/static/css/crash.css?v=20260403m">
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <img class="loading-screen-gif" src="/static/img/loading.gif" alt="">
        <div class="loading-text">Luna Gifts</div>
        <div class="load-progress-wrap"><div class="load-progress-bar" id="loadProgressBar"></div></div>
        <div class="load-status" id="loadStatus" data-i18n="loading">Loading...</div>
        <div class="load-percent" id="loadPercent">0%</div>
    </div>

    <!-- --- Top bar --- -->
    <div class="crash-topbar">
        <div class="crash-topbar-left">
            <div class="crash-avatar-wrap" id="crashAvatar">
                <img src="" alt="" id="crashAvatarImg">
            </div>
            <div class="crash-nick" id="crashNick">Player</div>
        </div>
        <div class="crash-topbar-right">
            <div class="crash-bal" onclick="openDepositModal()">
                <span id="crashBalVal">0</span>
                <img src="/static/img/star.png" alt="">
            </div>
        </div>
    </div>

    <!-- --- Game area --- -->
    <div class="crash-page">

        <!-- --- Game field with gift carousel --- -->
        <div class="crash-field" id="crashField">
            <div class="crash-gifts-carousel" id="giftsCarousel"></div>
            <div class="crash-center-overlay" id="crashOverlay">
                <div class="crash-mult" id="crashMult">&mdash;</div>
                <div class="crash-status-text" id="crashStatusText" data-i18n="waiting">WAITING</div>
            </div>
        </div>

        <!-- --- History bar --- -->
        <div class="crash-history" id="crashHistory"></div>

        <!-- --- Bet panel --- -->
        <div class="crash-bet-panel">
            <div class="crash-bet-tabs">
                <div class="crash-bet-tab active" data-tab="gift" onclick="setBetTab('gift')">Gift</div>
                <div class="crash-bet-tab" data-tab="stars" onclick="setBetTab('stars')">Stars</div>
            </div>

            <!-- Gift tab -->
            <div class="crash-bet-body" id="betBodyGift">
                <div class="crash-bet-gift-row">
                    <div class="crash-bet-gift-left">
                        <div class="crash-bet-gift-title" data-i18n="join_game">Join the game</div>
                        <div class="crash-bet-gift-sub" data-i18n="choose_gift">Choose a gift</div>
                    </div>
                    <button class="crash-select-gift-btn" id="selectGiftBtn" onclick="openGiftPicker()" data-i18n="select_plus">Select +</button>
                </div>
                <div class="crash-selected-gift" id="selectedGiftPreview" style="display:none;">
                    <img src="" alt="" id="selectedGiftImg">
                    <div class="crash-selected-gift-info">
                        <div class="crash-selected-gift-name" id="selectedGiftName"></div>
                        <div class="crash-selected-gift-val"><img src="/static/img/star.svg" alt=""> <span id="selectedGiftVal">0</span></div>
                    </div>
                    <button class="crash-remove-gift" onclick="removeSelectedGift()"><img src="/static/img/exit.png" alt="x" class="exit-btn-img"></button>
                </div>
            </div>

            <!-- Stars tab -->
            <div class="crash-bet-body" id="betBodyStars" style="display:none;">
                <div class="crash-stars-input-row">
                    <div class="crash-stars-input-wrap">
                        <img src="/static/img/star.svg" alt="" class="crash-stars-icon">
                        <input type="number" class="crash-stars-input" id="starsBetInput" data-i18n="bet_amount" placeholder="Bet amount" min="1" inputmode="numeric">
                        <button class="crash-stars-max" onclick="setMaxStarsBet()">MAX</button>
                    </div>
                </div>
            </div>

            <!-- Auto cashout -->
            <div class="crash-auto-row">
                <label class="crash-auto-label" data-i18n="auto_cashout">Auto cashout:</label>
                <input type="number" class="crash-auto-input" id="autoCashoutInput" placeholder="2.00" min="1.01" step="0.01">
            </div>

            <!-- Bet / Cashout button -->
            <button class="crash-action-btn" id="crashActionBtn" onclick="crashAction()">
                <span id="crashActionText" data-i18n="bet">Bet</span>
            </button>
        </div>

        <!-- --- Players --- -->
        <div class="crash-players-section">
            <div class="crash-players-header">
                <span data-i18n="players_in_round">Players in round</span> <span id="playersCount">0</span>
            </div>
            <div class="crash-players-list" id="playersList"></div>
        </div>
    </div>

    <!-- --- Gift Picker Modal --- -->
    <div class="crash-modal-overlay" id="giftPickerModal">
        <div class="crash-modal">
            <div class="crash-modal-header">
                <span data-i18n="choose_a_gift">Choose a gift</span>
                <button class="crash-modal-close" onclick="closeGiftPicker()"><img src="/static/img/exit.png" alt="x" class="exit-btn-img"></button>
            </div>
            <div class="crash-modal-body" id="giftPickerGrid"></div>
        </div>
    </div>

    <!-- --- Win Popup --- -->
    <div class="crash-win-overlay" id="winOverlay">
        <div class="crash-win-popup" id="winPopup">
            <img src="" alt="" class="crash-win-gift-img" id="winGiftImg" style="display:none;">
            <div class="crash-win-mult" id="winMult" style="display:none;"></div>
            <div class="crash-win-title" data-i18n="victory">Victory!</div>
            <div class="crash-win-details" id="winDetails"></div>
            <div class="crash-win-breakdown" id="winBreakdown" style="display:none;"></div>
            <button class="crash-win-close" onclick="closeWinPopup()"><img src="/static/img/exit.png" alt="x" class="exit-btn-img"></button>
            <button class="crash-win-btn" onclick="closeWinPopup()" data-i18n="collect">Collect</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-inner">
            <a href="/market" class="nav-item"><span class="nav-icon"><img src="/static/img/gift.png" alt=""></span><span class="nav-label" data-i18n="nav_market">Market</span></a>
            <a href="/" class="nav-item"><span class="nav-icon"><img src="/static/img/quest.png" alt=""></span><span class="nav-label" data-i18n="nav_quests">Quests</span></a>
            <a href="/games" class="nav-item active"><span class="nav-icon"><img src="/static/img/games.png" alt=""></span><span class="nav-label" data-i18n="nav_games">Games</span></a>
            <a href="/referral" class="nav-item"><span class="nav-icon"><img src="/static/img/ref.png" alt=""></span><span class="nav-label" data-i18n="nav_referrals">Referrals</span></a>
            <a href="/inventory" class="nav-item"><span class="nav-icon"><img src="/static/img/profil.png" alt=""></span><span class="nav-label" data-i18n="nav_profile">Profile</span></a>
        </div>
    </nav>

    <script src="/static/js/app.js?v=20260403m"></script>
    <script src="/static/js/crash.js?v=20260403m"></script>
</body>
</html>
